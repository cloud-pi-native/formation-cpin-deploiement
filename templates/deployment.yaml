apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demo-java-helm.fullname" . }}
  labels:
    {{- include "demo-java-helm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "demo-java-helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "demo-java-helm.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://{{ .Values.postgres.fullnameOverride }}:5432/{{ .Values.postgres.auth.database }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.postgres.auth.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-secret
                  key: PG_PASSWORD
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}