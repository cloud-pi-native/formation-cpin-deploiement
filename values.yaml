# Default values for demo-java-helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: harbor.dso.formation.numerique-interieur.fr/nom-projet/nom-image
  pullPolicy: Always
  # Surcharge le tag de l'image, dont la valeur par défaut est l'appVersion du chart.
  tag: "tuto"

imagePullSecrets: 
  - name: "registry-pull-secret"
nameOverride: ""
fullnameOverride: ""

service:
  port: 8080

ingress:
  enabled: true
  host: nom-projet.app.formation.numerique-interieur.fr

resources: 
  limits:
    memory: "512Mi"
    cpu: "500m"  
  requests:
    memory: "512Mi"
    cpu: "100m"  

postgres:
  fullnameOverride: postgres

  auth:
    # Le mot de passe est fourni par le secret pg-secret (templates/secret.yaml),
    # celui-là même que lit l'application dans son deployment.
    existingSecret: pg-secret
    secretKeys:
      passwordKey: "PG_PASSWORD"
      userPasswordKey: "PG_PASSWORD"
      adminPasswordKey: "PG_ROOT_PASSWORD"
    username: "userdemo"
    database: "userdemo"

  resources: 
    limits:
      memory: "512Mi"
      cpu: "500m"
    requests:
      memory: "512Mi"
      cpu: "100m"

  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 99999
    runAsGroup: 99999
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    
  podSecurityContext:
    fsGroup: 99999
    runAsUser: 99999
    runAsGroup: 99999
    runAsNonRoot: true

