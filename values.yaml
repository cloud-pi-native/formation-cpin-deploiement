# Default values for demo-java-helm.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: harbor.dso.formation.numerique-interieur.fr/nom-projet/nom-image
  pullPolicy: Always
  tag: "tuto"

imagePullSecrets: 
  - name: "registry-pull-secret"
nameOverride: ""
fullnameOverride: ""

service:
  port: 8080

ingress:
  enabled: true
  host: nom-projet.app.formation.numerique-interieur.fr

resources:
  limits:
    memory: "512Mi"
    cpu: "500m"
  requests:
    memory: "512Mi"
    cpu: "100m"

# L'image distroless:nonroot tourne déjà avec un utilisateur non privilégié.
# On ne fixe volontairement pas runAsUser, pour rester compatible avec les plages
# d'UID imposées par les clusters Openshift.
podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  seccompProfile:
    type: RuntimeDefault

startupProbe:
  httpGet:
    path: /api/demo/
    port: http
  initialDelaySeconds: 15
  periodSeconds: 5
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /api/demo/
    port: http
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /api/demo/demo
    port: http
  periodSeconds: 10

postgres:
  fullnameOverride: postgres

  auth:
    existingSecret: pg-secret
    secretKeys:
      passwordKey: "PG_PASSWORD"
      userPasswordKey: "PG_PASSWORD"
      adminPasswordKey: "PG_ROOT_PASSWORD"
    username: "userdemo"
    database: "userdemo"

  resources: 
    limits:
      memory: "512Mi"
      cpu: "500m"
    requests:
      memory: "512Mi"
      cpu: "100m"

  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 99999
    runAsGroup: 99999
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    
  podSecurityContext:
    fsGroup: 99999
    runAsUser: 99999
    runAsGroup: 99999
    runAsNonRoot: true

